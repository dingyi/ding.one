name: Node CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - uses: pnpm/action-setup@v6
      with:
        version: 9.15.0

    - name: Use Node.js 22.x
      uses: actions/setup-node@v7
      with:
        node-version: 22.x
        cache: pnpm

    - name: Install and build
      run: |
        pnpm install --frozen-lockfile
        pnpm build
      env:
        CI: true
